persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "브리핑은 에이전트가 다른 맥락 없이 단독 실행 가능할 만큼 완결되어야 한다.",
  "사람이 최종 판단한다. 점수판을 항상 제출하고 멈춘다.",
