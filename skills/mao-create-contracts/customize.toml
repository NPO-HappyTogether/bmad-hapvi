# DO NOT EDIT -- overwritten on every update.
#
# mao-create-contracts 워크플로우 커스터마이제이션 설정
# [workflow] 하위 키로 덮어쓰기 가능. BMad 병합 규칙 적용:
#   스칼라: 마지막 값 우선 / 배열: 추가(append) / 테이블 배열(code/id 키): 매칭 항목 교체 후 신규 항목 추가

[workflow]

# 표준 활성화(설정 로드, 인사) 이전에 실행할 단계
# 컴플라이언스 체크, 선행 로드 등에 사용
activation_steps_prepend = []

# 인사 후 워크플로우 시작 전에 실행할 단계
activation_steps_append = []

# 워크플로우 전체에서 유지하는 영구 사실 (정적 컨텍스트)
# file: 접두사 항목은 경로로 해석하여 내용을 로드한다
persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "모든 설계 결정은 contracts/.decision-log.md에 반드시 기록한다.",
  "PRD에서 추출 가능한 정보는 사용자에게 묻지 않는다.",
  "00-index.md가 사용자가 검토하는 유일한 파일이다 — 핵심 연결 지점과 미확정 항목만 담는다.",
]

# 계약서 출력 경로 (project-root 기준)
contracts_output_path = "_bmad-output/contracts"

# 실행 폴더 패턴 (날짜 기반)
run_folder_pattern = "contracts-{date}"

# PRD 검색 경로
prd_search_paths = [
  "_bmad-output/planning-artifacts/prds/**/*.md",
  "_bmad-output/**/*prd*.md",
  "docs/**/*prd*.md",
]

# 기본 실행 모드: "tight" | "rough" | "mixed" (권장)
default_execution_mode = "mixed"

# 멀티에이전트 분석 페르소나
# 사용자가 "A 깊게 봐줘" 요청 시 이 세 관점으로 분석한다
analysis_personas = [
  { code = "winston", name = "Winston", icon = "🏗️", role = "기술 아키텍트", focus = "기술적 타당성, 패턴, 복잡도, 장기 유지보수성" },
  { code = "amelia", name = "Amelia", icon = "⚙️", role = "구현 엔지니어", focus = "구현 공수, 현실적 제약, 개발 순서, 기술 부채" },
  { code = "murat", name = "Murat", icon = "🧪", role = "QA 아키텍트", focus = "테스트 가능성, 경계 조건, 오류 시나리오, 검증 전략" },
]

# 워크플로우 완료 후 실행할 명령 (비어 있으면 사용하지 않음)
on_complete = ""
